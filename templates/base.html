<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UUST Store — Интернет-магазин электроники</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <!-- Клиентская шапка магазина -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="/shop">🛍 UUST Store</a>
            <span class="navbar-text text-white-50 me-auto ms-2">
                Официальный розничный интернет-магазин
            </span>
            <div class="d-flex align-items-center">
                <a href="#orders-section" class="btn btn-light btn-sm me-2 fw-bold">📦 Мои покупки</a>
                <a href="/admin" class="btn btn-outline-light btn-sm opacity-75">Служебный вход</a>
            </div>
        </div>
    </nav>

    <main class="container pb-5">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center text-muted py-4 border-top bg-white mt-5">
        <small>© 2026 Розничная торговая фирма «UUST Store» (Вариант 2.2) | Разработчик: Буриков А.С.</small>
    </footer>
</body>
</html>
